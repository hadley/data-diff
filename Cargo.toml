[package]
name = "data-diff"
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace]
members = ["test-support"]

[features]
# The interactive UI (`--ui`): the HTTP server under `src/ui`, the only code
# needing serde. Default on so `cargo install` serves the app; off, the
# library stays free of serde (decision of 2026-08-10, preserved).
default = ["ui"]
ui = ["dep:serde"]

[dependencies]
arrow-array = "54"
arrow-buffer = "54"
arrow-cast = "54"
arrow-row = "54"
arrow-schema = "54"
arrow-select = "54"
clap = { version = "4", features = ["derive"] }
parquet = { version = "54", default-features = false, features = [
    "arrow",
    "snap",
    "flate2",
    "lz4",
    "zstd",
    "brotli",
] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
criterion = "0.5"
insta = { version = "1", features = ["json"] }
test-support = { path = "test-support" }

[[bench]]
name = "pipeline"
harness = false
