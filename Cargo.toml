[package]
name = "data-diff"
version = "0.0.1"
edition = "2024"
license = "MIT"

[dependencies]
arrow-array = "54"
arrow-cast = "54"
arrow-schema = "54"
arrow-select = "54"
clap = { version = "4", features = ["derive"] }
parquet = { version = "54", default-features = false, features = [
    "arrow",
    "snap",
    "flate2",
    "lz4",
    "zstd",
    "brotli",
] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
insta = "1"
