[package]
name = "data-diff-ui"
version = "0.0.1"
edition = "2021"
license = "MIT"

[dependencies]
data-diff = { path = "../.." }
arrow-array = "54"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
parquet = { version = "54", default-features = false, features = ["arrow"] }
test-support = { path = "../../test-support" }
